{% extends "core/base.html" %}
{% block content %}
<form method="post" enctype="multipart/form-data" class="max-w-lg mx-auto bg-white rounded-lg p-6 space-y-4 shadow-sm">
  {% csrf_token %}
  <h1 class="text-2xl font-bold">Sell an item</h1>
  <div><label class="block text-sm font-medium mb-1">Photos (first = cover)</label>
    <input type="file" name="images" accept="image/*" multiple class="w-full text-sm"></div>
  {% for field in form %}
    <div><label class="block text-sm font-medium mb-1">{{ field.label }}</label>
      {{ field }}{% if field.errors %}<p class="text-red-600 text-xs mt-1">{{ field.errors|join:", " }}</p>{% endif %}</div>
  {% endfor %}
  <button type="submit" class="w-full btn-green rounded py-3 font-semibold">Publish listing</button>
</form>
<style>input[type=text],input[type=number],input[type=email],input[type=password],textarea,select{width:100%;border:1px solid #ddd;border-radius:6px;padding:.6rem;font:inherit}</style>
{% endblock %}
