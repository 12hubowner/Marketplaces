{% extends "core/base.html" %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-lg p-6 shadow-sm space-y-4">
  <h1 class="text-2xl font-bold">Sign in</h1>
  {% if error %}<div class="bg-red-100 text-red-800 px-3 py-2 rounded text-sm">{{ error }}</div>{% endif %}
  <form method="post" action="{% url 'login' %}" class="space-y-3">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <div><label class="block text-sm font-medium mb-1">Username or email</label>
      <input name="username" required autofocus autocomplete="username" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Password</label>
      <input name="password" type="password" required autocomplete="current-password" class="w-full border rounded px-3 py-2"></div>
    <button class="w-full btn-green rounded py-2 font-semibold">Sign in</button>
  </form>
  <p class="text-sm text-center text-gray-600">No account? <a href="{% url 'register' %}" class="underline">Sign up</a></p>
</div>
{% endblock %}
