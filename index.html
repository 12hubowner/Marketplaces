<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui,sans-serif}.btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}.hidden{display:none!important}</style>
</head>
<body class="bg-gray-50 text-gray-900">
<header class="bg-white border-b sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
    <a href="#" onclick="go('home')" class="font-bold text-lg flex items-center gap-2">
      <span class="w-6 h-6 rounded bg-green-600 flex items-center justify-center text-white text-xs">M</span>Marketplace</a>
    <input id="search" placeholder="Search..." oninput="renderHome()" class="flex-1 max-w-2xl border rounded-full px-4 py-2 text-sm">
    <nav class="flex items-center gap-3 text-sm flex-wrap">
      <a href="#" onclick="go('home')" class="hover:text-green-600">Home</a>
      <a href="#" onclick="go('messages')" class="hover:text-green-600">Messages</a>
      <a href="#" onclick="go('sell')" class="btn-green px-4 py-2 rounded-full font-semibold">+ Sell now</a>
      <span id="authArea"></span>
    </nav>
  </div>
</header>
<main id="app" class="max-w-7xl mx-auto p-4"></main>
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"></div>
<script>
const DB={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){localStorage.setItem(k,JSON.stringify(v))}};
const CATS=["Women","Men","Electronics","Home & Garden","Beauty","Sports","Toys & Games","Vintage"];
const COLORS=["black","white","red","blue","green","yellow","pink","purple","brown"];
const ADMIN={username:"Sabawoon",password:"Sabawoon1$"};
let state={
  page:"home",detail:null,thread:null,filter:null,
  currentUser:DB.get("currentUser",null),
  listings:DB.get("listings",[]),
  users:DB.get("users",[{username:ADMIN.username,password:ADMIN.password,isAdmin:true}]),
  chats:DB.get("chats",[]),offers:DB.get("offers",[]),bans:DB.get("bans",[])
};
function save(){DB.set("listings",state.listings);DB.set("users",state.users);DB.set("chats",state.chats);DB.set("offers",state.offers);DB.set("bans",state.bans);DB.set("currentUser",state.currentUser)}
if(state.listings.length===0){
  state.listings=[
    {id:1,title:"Gaming Laptop",price:950,category:"Electronics",color:"black",brand:"ASUS",condition:"good",seller:"demo",description:"RTX 4060, 16GB RAM.",image:"https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=800",views:40,likes:[],createdAt:Date.now()-2*86400000},
    {id:2,title:"LG WASHER AND DRYER SET",price:300,category:"Home & Garden",color:"white",brand:"LG",condition:"like_new",seller:"demo",description:"Barely used.",image:"https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=800",views:40,likes:["a","b","c"],createdAt:Date.now()-2*86400000},
    {id:3,title:"iPhone 15 Pro",price:800,category:"Electronics",color:"black",brand:"Apple",condition:"like_new",seller:"demo",description:"256GB unlocked.",image:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=800",views:120,likes:["a","b","c","d","e"],createdAt:Date.now()-86400000},
    {id:4,title:"Nike Air Max",price:85,category:"Men",color:"white",brand:"Nike",condition:"good",seller:"demo",size:"10",description:"Worn twice.",image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800",views:30,likes:[],createdAt:Date.now()-3600000},
    {id:5,title:"Vintage Leather Jacket",price:120,category:"Vintage",color:"brown",brand:"",condition:"good",seller:"demo",description:"1980s style.",image:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=800",views:55,likes:["a"],createdAt:Date.now()-7200000}
  ];save();
}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return s+"s";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";if(s<2592000)return Math.floor(s/86400)+"d";return Math.floor(s/2592000)+"mo"}
function isBanned(u){return u&&state.bans.some(b=>b.username===u.username&&b.active)}
function go(p,d){state.page=p;if(d!==undefined)state.detail=d;render();window.scrollTo(0,0)}
function logout(){state.currentUser=null;save();go("home")}
function render(){
  document.getElementById("authArea").innerHTML=state.currentUser
    ?`${state.currentUser.isAdmin?'<a href="#" onclick="go(\\'admin\\')" class="hover:text-green-600 font-medium">🛡 Admin</a>':''}<span class="text-gray-600">@${state.currentUser.username}</span><a href="#" onclick="logout()" class="hover:text-green-600">Sign out</a>`
    :`<a href="#" onclick="go('login')" class="hover:text-green-600 font-medium">Sign In</a><a href="#" onclick="go('register')" class="btn-green px-4 py-2 rounded-full font-semibold">Sign up</a>`;
  const app=document.getElementById("app");
  if(state.page==="home")return renderHome();
  if(state.page==="sell")return renderSell();
  if(state.page==="detail")return renderDetail(state.detail);
  if(state.page==="login")return renderLogin();
  if(state.page==="register")return renderRegister();
  if(state.page==="messages")return renderInbox();
  if(state.page==="thread")return renderThread(state.thread);
  if(state.page==="admin")return renderAdmin();
}
function renderHome(){
  const q=(document.getElementById("search")?.value||"").toLowerCase();
  let list=state.listings.filter(l=>!l.archived);
  if(q)list=list.filter(l=>l.title.toLowerCase().includes(q)||l.description.toLowerCase().includes(q));
  if(state.filter)list=list.filter(l=>l.category===state.filter);
  const browsing=q||state.filter;
  const app=document.getElementById("app");
  if(browsing){
    app.innerHTML=`<div class="mb-4 text-sm text-gray-600">${list.length} result${list.length!==1?'s':''}${state.filter?` in <b>${state.filter}</b>`:''}${q?` for "<b>${q}</b>"`:''}${state.filter||q?`<button onclick="clearFilter()" class="ml-2 underline text-green-600">Clear</button>`:''}</div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">${list.map(card).join("")||`<p class="col-span-full text-center text-gray-500 py-16">No items</p>`}</div>`;
    return;
  }
  const trending=[...list].sort((a,b)=>b.likes.length-a.likes.length).slice(0,10);
  const latest=[...list].sort((a,b)=>b.createdAt-a.createdAt).slice(0,10);
  const counts={};state.listings.forEach(l=>counts[l.category]=(counts[l.category]||0)+1);
  app.innerHTML=`
    <section class="bg-gradient-to-b from-green-50 to-transparent -mx-4 px-4 pt-10 pb-12 text-center">
      <h1 class="text-4xl md:text-5xl font-bold">Buy &amp; Sell <span class="text-green-600">Anything</span></h1>
      <p class="text-gray-600 mt-3 max-w-lg mx-auto">Turn unused stuff into cash in minutes.</p>
      <div class="mt-6 flex justify-center gap-3">
        <a href="#" onclick="go('sell')" class="btn-green px-6 py-3 rounded-full font-semibold">Start Selling</a>
        <a href="#" onclick="setFilter('Electronics')" class="border border-gray-300 px-6 py-3 rounded-full font-semibold hover:bg-gray-50">Browse Deals</a>
      </div>
      <p class="text-xs text-gray-500 mt-3">✓ ${state.listings.length} listings already on the marketplace</p>
    </section>
    <section class="py-8"><h2 class="text-lg font-bold mb-4">Shop by Category</h2>
      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-8 gap-3">
        ${CATS.map(c=>`<button onclick="setFilter('${c}')" class="bg-white border rounded-lg p-3 flex flex-col items-center gap-1 hover:border-green-500 transition">
          <span class="w-8 h-8 rounded-full bg-green-100 text-green-700 flex items-center justify-center text-xs font-bold">${c[0]}</span>
          <span class="text-xs text-center font-medium leading-tight">${c}</span>
          <span class="text-[10px] text-gray-400">${counts[c]||0}</span></button>`).join("")}
      </div></section>
    ${trending.length?`<section class="py-8"><h2 class="text-lg font-bold mb-4"><span class="text-green-600">▲</span> Trending Now</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">${trending.map(l=>card(l,true)).join("")}</div></section>`:""}
    <section class="py-10 border-t"><div class="grid md:grid-cols-3 gap-6 max-w-4xl mx-auto">
      <div class="text-center"><div class="w-12 h-12 mx-auto rounded-full bg-green-100 text-green-700 flex items-center justify-center text-xl">✓</div><h3 class="font-semibold mt-3">Verified Sellers</h3><p class="text-xs text-gray-500 mt-1">All sellers verified.</p></div>
      <div class="text-center"><div class="w-12 h-12 mx-auto rounded-full bg-green-100 text-green-700 flex items-center justify-center text-xl">🔒</div><h3 class="font-semibold mt-3">Secure Payments</h3><p class="text-xs text-gray-500 mt-1">Buy safely.</p></div>
      <div class="text-center"><div class="w-12 h-12 mx-auto rounded-full bg-green-100 text-green-700 flex items-center justify-center text-xl">💬</div><h3 class="font-semibold mt-3">Easy Communication</h3><p class="text-xs text-gray-500 mt-1">Chat directly.</p></div>
    </div></section>
    ${latest.length?`<section class="py-8"><h2 class="text-lg font-bold mb-4"><span class="text-green-600">◆</span> Latest Listings</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">${latest.map(l=>card(l,false,true)).join("")}</div></section>`:""}`;
}
function setFilter(c){state.filter=state.filter===c?null:c;render()}
function clearFilter(){state.filter=null;document.getElementById("search").value="";render()}
function card(l,showCart=false,showBadges=false){
  const badge=showBadges?(l.condition==="new"?`<span class="absolute top-2 left-2 bg-green-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">NEW</span>`:l.condition==="like_new"?`<span class="absolute top-2 left-2 bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">LIKE NEW</span>`:""):"";
  const hot=(showBadges&&l.likes.length>3)?`<span class="absolute top-2 right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded">🔥 ${l.likes.length}</span>`:"";
  return `<div onclick="go('detail',${l.id})" class="bg-white rounded-lg overflow-hidden hover:shadow-md transition cursor-pointer relative">
    <div class="relative"><img src="${l.image}" class="w-full aspect-square object-cover" onerror="this.src='https://via.placeholder.com/400'">${badge}${hot}</div>
    <div class="p-3 space-y-1">
      <p class="font-semibold text-sm text-green-600">$${Number(l.price).toFixed(2)}</p>
      <p class="text-sm truncate">${l.title}</p>
      <p class="text-[11px] text-gray-500 truncate">@${l.seller} · ${l.category}</p>
      ${showCart?`<div class="pt-2"><span class="block w-full text-center btn-green rounded-md py-2 text-xs font-semibold">Add to Cart</span></div>`:""}
    </div></div>`;
}
function renderDetail(id){
  const l=state.listings.find(x=>x.id===id);if(!l)return go("home");
  l.views=(l.views||0)+1;save();
  const me=state.currentUser;const isMine=me&&me.username===l.seller;const liked=me&&l.likes.includes(me.username);
  const myOffer=me?state.offers.find(o=>o.listingId===l.id&&o.buyer===me.username&&o.status==="pending"):null;
  document.getElementById("app").innerHTML=`
    <nav class="text-xs text-gray-500 mb-4"><a href="#" onclick="go('home')" class="hover:underline">Home</a> / <a href="#" onclick="setFilter('${l.category}');go('home')" class="hover:underline">${l.category}</a> / <span class="text-gray-800">${l.title}</span></nav>
    <div class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2"><img src="${l.image}" class="w-full rounded-lg border bg-white object-contain max-h-[520px]" onerror="this.src='https://via.placeholder.com/800'"></div>
      <aside class="space-y-4">
        <div class="bg-white rounded-lg p-5 border space-y-3">
          <h1 class="text-2xl font-bold uppercase">${l.title}</h1>
          <div class="flex items-center gap-3"><p class="text-3xl font-bold text-green-600">$${Number(l.price).toFixed(2)}</p><span class="bg-gray-100 text-gray-700 text-xs font-semibold px-3 py-1 rounded-full">Negotiable</span></div>
          <div class="flex items-center gap-5 text-sm text-gray-500"><span>👁 ${l.views} views</span><span>♡ ${l.likes.length} likes</span><span>🕒 ${timeAgo(l.createdAt)} ago</span></div>
          <div class="flex gap-2 pt-3">
            ${me&&!isMine?`<button onclick="startChat(${l.id})" class="flex-1 btn-green rounded-lg py-3 font-semibold">💬 Message Seller</button><button onclick="openOffer(${l.id})" class="flex-1 border-2 border-gray-200 rounded-lg py-3 font-semibold hover:bg-gray-50">$ Make Offer</button>`
              :isMine?`<button onclick="editListing(${l.id})" class="flex-1 border rounded-lg py-3">✏️ Edit</button><button onclick="deleteListing(${l.id})" class="flex-1 border border-red-200 text-red-600 rounded-lg py-3">🗑 Delete</button>`
              :`<a href="#" onclick="go('login')" class="flex-1 btn-green rounded-lg py-3 font-semibold text-center">Sign in to buy</a>`}
          </div>
          ${myOffer?`<div class="bg-yellow-50 border border-yellow-200 text-yellow-900 text-xs rounded-lg p-3">You offered <b>$${Number(myOffer.amount).toFixed(2)}</b> (pending)</div>`:""}
          ${me&&!isMine?`<div class="text-center pt-1"><a href="#" onclick="toggleLike(${l.id})" class="text-sm text-gray-600 hover:text-red-500">${liked?"❤️ Saved":"🤍 Save"}</a></div>`:""}
        </div>
        <div class="bg-white rounded-lg p-4 border"><div class="flex flex-wrap gap-2 text-xs">
          <span class="bg-gray-100 px-3 py-1 rounded-full">${l.condition.replace("_"," ")}</span>
          ${l.color?`<span class="bg-gray-100 px-3 py-1 rounded-full">Color: ${l.color}</span>`:""}
          ${l.brand?`<span class="bg-gray-100 px-3 py-1 rounded-full">${l.brand}</span>`:""}
        </div></div>
        <div class="bg-green-50 border border-green-200 rounded-lg p-4 text-sm text-green-800 space-y-1">
          <div>✓ Get it between ${new Date(l.createdAt+2*86400000).toLocaleDateString()} and ${new Date(l.createdAt+5*86400000).toLocaleDateString()}</div>
          <div>✓ Free shipping over $50</div>
        </div>
        <div class="bg-white rounded-lg p-5 border"><h2 class="font-semibold mb-2">Description</h2><p class="text-sm text-gray-700 whitespace-pre-wrap">${l.description}</p></div>
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 text-xs text-yellow-900"><p class="font-semibold mb-1">⚠️ Safety Tips</p><ul class="list-disc pl-5 space-y-0.5"><li>Meet in public place</li><li>Never pay outside platform</li><li>Inspect before purchase</li><li>Report suspicious listings</li></ul></div>
      </aside>
    </div>`;
}
function toggleLike(id){const l=state.listings.find(x=>x.id===id);const me=state.currentUser;if(!me)return go("login");const i=l.likes.indexOf(me.username);if(i>=0)l.likes.splice(i,1);else l.likes.push(me.username);save();renderDetail(id)}
function openOffer(id){
  const l=state.listings.find(x=>x.id===id);
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modal").innerHTML=`
    <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4">
      <div class="flex justify-between items-center"><h2 class="text-lg font-bold">Make an Offer</h2><button onclick="closeModal()" class="text-gray-400 text-xl">✕</button></div>
      <div class="bg-gray-50 rounded-lg p-3 flex items-center gap-3"><img src="${l.image}" class="w-12 h-12 rounded object-cover"><div><p class="text-sm font-semibold uppercase">${l.title}</p><p class="text-sm text-green-600 font-bold">$${Number(l.price).toFixed(2)}</p></div></div>
      <form onsubmit="submitOffer(event,${id})" class="space-y-4">
        <div><label class="block text-sm font-semibold mb-1">Your Offer</label><div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">$</span><input id="offerAmt" type="number" step="0.01" min="0.01" required placeholder="0.00" class="w-full border rounded-lg pl-7 pr-3 py-3"></div></div>
        <div><label class="block text-sm font-semibold mb-1">Message (optional)</label><textarea id="offerMsg" rows="3" placeholder="Add a message..." class="w-full border rounded-lg px-3 py-2 text-sm"></textarea></div>
        <div class="flex gap-2"><button type="button" onclick="closeModal()" class="flex-1 border rounded-lg py-3 font-semibold">Cancel</button><button type="submit" class="flex-1 btn-green rounded-lg py-3 font-semibold">➤ Send Offer</button></div>
      </form>
    </div>`;
}
function submitOffer(e,id){
  e.preventDefault();const me=state.currentUser;const amt=parseFloat(document.getElementById("offerAmt").value);const msg=document.getElementById("offerMsg").value;
  const l=state.listings.find(x=>x.id===id);
  state.offers.push({id:Date.now(),listingId:id,buyer:me.username,seller:l.seller,amount:amt,message:msg,status:"pending",createdAt:Date.now()});
  let chat=state.chats.find(c=>c.listingId===id&&c.buyer===me.username);
  if(!chat){chat={id:Date.now(),listingId:id,buyer:me.username,seller:l.seller,messages:[]};state.chats.push(chat)}
  chat.messages.push({from:me.username,text:`💰 Offer: $${amt.toFixed(2)}${msg?"\n\n"+msg:""}`,at:Date.now()});
  save();closeModal();alert(`Offer of $${amt.toFixed(2)} sent to @${l.seller}`);go("detail",id);
}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function renderSell(){
  if(!state.currentUser)return go("login");
  document.getElementById("app").innerHTML=`
    <form onsubmit="createListing(event)" class="max-w-lg mx-auto bg-white rounded-lg p-6 space-y-4 shadow-sm">
      <h1 class="text-2xl font-bold">Sell an item</h1>
      <div><label class="block text-sm font-medium mb-1">Photo URL</label><input id="newImage" placeholder="https://..." class="w-full border rounded px-3 py-2"></div>
      <div><label class="block text-sm font-medium mb-1">Title</label><input id="newTitle" required class="w-full border rounded px-3 py-2"></div>
      <div><label class="block text-sm font-medium mb-1">Price ($)</label><input id="newPrice" type="number" step="0.01" required class="w-full border rounded px-3 py-2"></div>
      <div><label class="block text-sm font-medium mb-1">Category</label><select id="newCat" class="w-full border rounded px-3 py-2">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>
      <div><label class="block text-sm font-medium mb-1">Color</label><select id="newColor" class="w-full border rounded px-3 py-2">${COLORS.map(c=>`<option>${c}</option>`).join("")}</select></div>
      <div><label class="block text-sm font-medium mb-1">Condition</label><select id="newCond" class="w-full border rounded px-3 py-2"><option value="new">New</option><option value="like_new">Like new</option><option value="good" selected>Good</option><option value="fair">Fair</option></select></div>
      <div><label class="block text-sm font-medium mb-1">Description</label><textarea id="newDesc" rows="4" required class="w-full border rounded px-3 py-2"></textarea></div>
      <button class="w-full btn-green rounded py-3 font-semibold">Publish listing</button>
    </form>`;
}
function createListing(e){
  e.preventDefault();const me=state.currentUser;
  state.listings.unshift({id:Date.now(),title:document.getElementById("newTitle").value,price:parseFloat(document.getElementById("newPrice").value),category:document.getElementById("newCat").value,color:document.getElementById("newColor").value,condition:document.getElementById("newCond").value,description:document.getElementById("newDesc").value,image:document.getElementById("newImage").value||"https://via.placeholder.com/400",seller:me.username,views:0,likes:[],createdAt:Date.now()});
  save();go("home");
}
function editListing(id){
  const l=state.listings.find(x=>x.id===id);
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("modal").innerHTML=`
    <div class="bg-white rounded-2xl w-full max-w-md p-6 space-y-4">
      <div class="flex justify-between"><h2 class="text-lg font-bold">Edit listing</h2><button onclick="closeModal()" class="text-gray-400 text-xl">✕</button></div>
      <form onsubmit="saveEdit(event,${id})" class="space-y-3">
        <input id="eTitle" value="${l.title}" required class="w-full border rounded px-3 py-2">
        <input id="ePrice" type="number" step="0.01" value="${l.price}" required class="w-full border rounded px-3 py-2">
        <select id="eCat" class="w-full border rounded px-3 py-2">${CATS.map(c=>`<option ${c===l.category?"selected":""}>${c}</option>`).join("")}</select>
        <textarea id="eDesc" rows="3" required class="w-full border rounded px-3 py-2">${l.description}</textarea>
        <div class="flex gap-2"><button type="button" onclick="closeModal()" class="flex-1 border rounded py-2">Cancel</button><button type="submit" class="flex-1 btn-green rounded py-2 font-semibold">Save</button></div>
      </form>
    </div>`;
}
function saveEdit(e,id){e.preventDefault();const l=state.listings.find(x=>x.id===id);l.title=document.getElementById("eTitle").value;l.price=parseFloat(document.getElementById("ePrice").value);l.category=document.getElementById("eCat").value;l.description=document.getElementById("eDesc").value;save();closeModal();renderDetail(id)}
function deleteListing(id){if(!confirm("Delete this listing?"))return;state.listings=state.listings.filter(x=>x.id!==id);save();go("home")}
function renderLogin(){
  document.getElementById("app").innerHTML=`<div class="max-w-sm mx-auto bg-white rounded-lg p-6 shadow-sm space-y-4">
    <h1 class="text-2xl font-bold">Sign in</h1><div id="err" class="hidden bg-red-100 text-red-800 px-3 py-2 rounded text-sm"></div>
    <form onsubmit="doLogin(event)" class="space-y-3">
      <div><label class="block text-sm font-medium mb-1">Username</label><input id="lUser" required class="w-full border rounded px-3 py-2"></div>
      <div><label class="block text-sm font-medium mb-1">Password</label><input id="lPass" type="password" required class="w-full border rounded px-3 py-2"></div>
      <button class="w-full btn-green rounded py-2 font-semibold">Sign in</button>
    </form>
    <p class="text-sm text-center text-gray-600">No account? <a href="#" onclick="go('register')" class="underline">Sign up</a></p>
  </div>`;
}
function doLogin(e){
  e.preventDefault();const u=document.getElementById("lUser").value.trim();const p=document.getElementById("lPass").value;
  const user=state.users.find(x=>x.username===u&&x.password===p);
  if(!user){document.getElementById("err").classList.remove("hidden");document.getElementById("err").textContent="Wrong username or password.";return}
  if(isBanned(user)){document.getElementById("err").classList.remove("hidden");document.getElementById("err").textContent="Your account has been banned.";return}
  state.currentUser=user;save();go("home");
}
function renderRegister(){
  document.getElementById("app").innerHTML=`<div class="max-w-sm mx-auto bg-white rounded-lg p-6 shadow-sm space-y-4">
    <h1 class="text-2xl font-bold">Create account</h1><div id="err" class="hidden bg-red-100 text-red-800 px-3 py-2 rounded text-sm"></div>
    <form onsubmit="doRegister(event)" class="space-y-3">
      <div><label class="block text-sm font-medium mb-1">Username</label><input id="rUser" required class="w-full border rounded px-3 py-2"></div>
      <div><label class="block text-sm font-medium mb-1">Password</label><input id="rPass" type="password" required class="w-full border rounded px-3 py-2"></div>
      <div><label class="block text-sm font-medium mb-1">Confirm password</label><input id="rPass2" type="password" required class="w-full border rounded px-3 py-2"></div>
      <button class="w-full btn-green rounded py-2 font-semibold">Sign up</button>
    </form>
    <p class="text-sm text-center text-gray-600">Have an account? <a href="#" onclick="go('login')" class="underline">Sign in</a></p>
  </div>`;
}
function doRegister(e){
  e.preventDefault();const u=document.getElementById("rUser").value.trim();const p=document.getElementById("rPass").value;const p2=document.getElementById("rPass2").value;
  const err=document.getElementById("err");
  if(p!==p2){err.classList.remove("hidden");err.textContent="Passwords don't match.";return}
  if(state.users.find(x=>x.username===u)){err.classList.remove("hidden");err.textContent="Username taken.";return}
  const user={username:u,password:p,isAdmin:false};state.users.push(user);state.currentUser=user;save();go("home");
}
function startChat(listingId){
  const me=state.currentUser;const l=state.listings.find(x=>x.id===listingId);
  let chat=state.chats.find(c=>c.listingId===listingId&&c.buyer===me.username);
  if(!chat){chat={id:Date.now(),listingId,buyer:me.username,seller:l.seller,messages:[]};state.chats.push(chat);save()}
  go("thread",chat.id);
}
function renderInbox(){
  if(!state.currentUser)return go("login");
  const me=state.currentUser;const chats=state.chats.filter(c=>c.buyer===me.username||c.seller===me.username);
  document.getElementById("app").innerHTML=`<h1 class="text-2xl font-bold mb-4">Messages</h1>
    ${chats.length?`<div class="bg-white rounded-lg divide-y">${chats.map(c=>{
      const l=state.listings.find(x=>x.id===c.listingId);const last=c.messages[c.messages.length-1];const other=c.buyer===me.username?c.seller:c.buyer;
      return `<a href="#" onclick="go('thread',${c.id})" class="flex items-center gap-4 p-4 hover:bg-gray-50">
        <div class="w-12 h-12 rounded-full bg-green-100 text-green-700 flex items-center justify-center font-bold">${other[0].toUpperCase()}</div>
        <div class="flex-1 min-w-0"><p class="font-semibold">@${other}</p><p class="text-sm text-gray-500 truncate">${l?l.title:"(deleted)"} · ${last?(last.from===me.username?"You: ":"")+last.text.slice(0,40):"No messages"}</p></div>
      </a>`}).join("")}</div>`:`<p class="text-gray-500 text-center py-16">No conversations yet.</p>`}`;
}
function renderThread(id){
  const me=state.currentUser;const c=state.chats.find(x=>x.id===id);if(!c)return go("messages");
  const l=state.listings.find(x=>x.id===c.listingId);const other=c.buyer===me.username?c.seller:c.buyer;
  document.getElementById("app").innerHTML=`<div class="max-w-2xl mx-auto">
    <div class="flex justify-between mb-4"><a href="#" onclick="go('messages')" class="text-sm underline">← Inbox</a><p class="font-semibold">@${other}</p></div>
    ${l?`<a href="#" onclick="go('detail',${l.id})" class="bg-white rounded-lg p-3 mb-4 flex items-center gap-3 border"><img src="${l.image}" class="w-14 h-14 rounded object-cover"><div><p class="text-sm font-semibold">${l.title}</p><p class="text-sm text-green-600">$${Number(l.price).toFixed(2)}</p></div></a>`:""}
    <div class="bg-white rounded-lg p-4 space-y-3 border" style="min-height:300px;max-height:60vh;overflow-y:auto">
      ${c.messages.map(m=>`<div class="flex ${m.from===me.username?"justify-end":"justify-start"}"><div class="max-w-[75%] px-3 py-2 rounded-2xl text-sm ${m.from===me.username?"bg-green-600 text-white":"bg-gray-100"}">${m.text.replace(/\n/g,"<br>")}<div class="text-[10px] opacity-60 mt-1">${timeAgo(m.at)} ago</div></div></div>`).join("")||`<p class="text-center text-gray-400 py-8">Say hi 👋</p>`}
    </div>
    <form onsubmit="sendMsg(event,${id})" class="mt-4 flex gap-2"><input id="msgInput" required autofocus placeholder="Type a message..." class="flex-1 border rounded-full px-4 py-2"><button class="btn-green rounded-full px-6 font-semibold">Send</button></form>
  </div>`;
}
function sendMsg(e,id){e.preventDefault();const c=state.chats.find(x=>x.id===id);c.messages.push({from:state.currentUser.username,text:document.getElementById("msgInput").value,at:Date.now()});save();renderThread(id)}
function renderAdmin(){
  const me=state.currentUser;if(!me||!me.isAdmin)return go("home");
  const banned=state.bans.filter(b=>b.active);
  document.getElementById("app").innerHTML=`<h1 class="text-2xl font-bold mb-6">🛡 Admin Dashboard</h1>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-lg p-4 border"><p class="text-xs text-gray-500">Users</p><p class="text-3xl font-bold">${state.users.length}</p></div>
      <div class="bg-white rounded-lg p-4 border"><p class="text-xs text-gray-500">Listings</p><p class="text-3xl font-bold">${state.listings.length}</p></div>
      <div class="bg-white rounded-lg p-4 border"><p class="text-xs text-gray-500">Chats</p><p class="text-3xl font-bold">${state.chats.length}</p></div>
      <div class="bg-white rounded-lg p-4 border"><p class="text-xs text-gray-500">Active bans</p><p class="text-3xl font-bold text-red-600">${banned.length}</p></div>
    </div>
    <h2 class="font-semibold text-lg mb-2">Users</h2>
    <div class="bg-white rounded-lg border overflow-hidden mb-6"><table class="w-full text-sm">
      <thead class="bg-gray-50 text-left text-xs text-gray-500"><tr><th class="px-4 py-2">Username</th><th class="px-4 py-2">Admin</th><th class="px-4 py-2">Status</th><th class="px-4 py-2">Actions</th></tr></thead>
      <tbody class="divide-y">${state.users.map(u=>{const isBan=state.bans.find(b=>b.username===u.username&&b.active);return `<tr>
        <td class="px-4 py-2 font-medium">@${u.username}</td>
        <td class="px-4 py-2">${u.isAdmin?"✅":"—"}</td>
        <td class="px-4 py-2">${isBan?`<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded">BANNED</span>`:`<span class="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">Active</span>`}</td>
        <td class="px-4 py-2">${u.username===ADMIN.username?"—":isBan?`<button onclick="unban('${u.username}')" class="text-green-600 underline text-xs">Unban</button>`:`<button onclick="ban('${u.username}')" class="text-red-600 underline text-xs">Ban</button>`}</td>
      </tr>`}).join("")}</tbody>
    </table></div>
    <h2 class="font-semibold text-lg mb-2">Listings</h2>
    <div class="bg-white rounded-lg border overflow-hidden"><table class="w-full text-sm">
      <thead class="bg-gray-50 text-left text-xs text-gray-500"><tr><th class="px-4 py-2">Photo</th><th class="px-4 py-2">Title</th><th class="px-4 py-2">Seller</th><th class="px-4 py-2">Price</th><th class="px-4 py-2">Actions</th></tr></thead>
      <tbody class="divide-y">${state.listings.map(l=>`<tr>
        <td class="px-4 py-2"><img src="${l.image}" class="w-10 h-10 rounded object-cover"></td>
        <td class="px-4 py-2">${l.title}</td>
        <td class="px-4 py-2 text-gray-600">@${l.seller}</td>
        <td class="px-4 py-2">$${Number(l.price).toFixed(2)}</td>
        <td class="px-4 py-2"><button onclick="adminDel(${l.id})" class="text-red-600 underline text-xs">Delete</button></td>
      </tr>`).join("")}</tbody>
    </table></div>`;
}
function ban(u){if(!confirm(`Ban @${u} permanently?`))return;state.bans.push({username:u,active:true,at:Date.now()});save();renderAdmin()}
function unban(u){state.bans.forEach(b=>{if(b.username===u)b.active=false});save();renderAdmin()}
function adminDel(id){if(!confirm("Delete this listing?"))return;state.listings=state.listings.filter(x=>x.id!==id);save();renderAdmin()}
render();
</script>
</body>
</html>
