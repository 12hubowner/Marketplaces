<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Marketplace{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .btn-green { background: #16a34a; color: white; display: inline-block; }
    .btn-green:hover { background: #15803d; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-white border-b sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-4">
      <a href="/" class="font-bold text-lg flex items-center gap-2 whitespace-nowrap">
        <span class="w-6 h-6 rounded bg-green-600 flex items-center justify-center text-white text-xs">M</span>
        Marketplace
      </a>
      <form method="get" action="/" class="flex-1 max-w-2xl">
        <div class="relative">
          <input name="q" value="{{ q|default:'' }}" placeholder="Search for anything..."
                 class="w-full border rounded-full pl-4 pr-10 py-2 text-sm focus:outline-none focus:border-green-500">
          <button class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</button>
        </div>
      </form>
      <nav class="hidden md:flex items-center gap-4 text-sm whitespace-nowrap">
        <a href="/" class="hover:text-green-600">Home</a>
        <a href="/messages/" class="hover:text-green-600">Messages</a>
        {% if user.is_authenticated %}
          {% if user.is_staff %}<a href="/dashboard/" class="hover:text-green-600 font-medium">🛡 Admin</a>{% endif %}
          <a href="/sell/" class="btn-green px-4 py-2 rounded-full font-semibold">+ Sell now</a>
          <a href="/u/{{ user.username }}/" class="hover:text-green-600">{{ user.username }}</a>
          <a href="/logout/" class="hover:text-green-600">Sign out</a>
        {% else %}
          <a href="/login/" class="hover:text-green-600 font-medium">Sign In</a>
          <a href="/register/" class="btn-green px-4 py-2 rounded-full font-semibold">Sign up</a>
        {% endif %}
      </nav>
    </div>
  </header>
  {% if messages %}
    <div class="max-w-7xl mx-auto px-4 pt-4">
      {% for m in messages %}<div class="bg-green-100 text-green-800 px-4 py-2 rounded mb-2">{{ m }}</div>{% endfor %}
    </div>
  {% endif %}
  <main class="max-w-7xl mx-auto p-4">{% block content %}{% endblock %}</main>
</body>
</html>
