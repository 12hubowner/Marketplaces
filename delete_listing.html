{% extends "core/base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg p-6 shadow-sm text-center space-y-4">
  <h1 class="text-xl font-bold text-red-600">Delete listing?</h1>
  <p>Are you sure you want to delete <strong>{{ listing.title }}</strong>? This cannot be undone.</p>
  <form method="post" class="flex gap-2 justify-center">{% csrf_token %}
    <button class="bg-red-600 text-white rounded px-6 py-2 font-semibold">Yes, delete</button>
    <a href="{% url 'listing_detail' listing.slug %}" class="border rounded px-6 py-2">Cancel</a>
  </form>
</div>
{% endblock %}
