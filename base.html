<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} · Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:system-ui,sans-serif}</style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-56 bg-black text-white flex-shrink-0 hidden md:flex flex-col">
      <div class="px-4 py-5 border-b border-gray-800">
        <p class="font-bold text-lg">🛡 Admin</p>
        <p class="text-xs text-gray-400 mt-1">{{ user.username }}</p>
      </div>
      <nav class="flex-1 p-2 space-y-1 text-sm">
        <a href="{% url 'dash_index' %}" class="block px-3 py-2 rounded {% if active == 'index' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}">📊 Dashboard</a>
        <a href="{% url 'dash_users' %}" class="block px-3 py-2 rounded {% if active == 'users' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}">👥 Users</a>
        <a href="{% url 'dash_listings' %}" class="block px-3 py-2 rounded {% if active == 'listings' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}">📦 Listings</a>
        <a href="{% url 'dash_messages' %}" class="block px-3 py-2 rounded {% if active == 'messages' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}">💬 Messages</a>
        <a href="{% url 'dash_bans' %}" class="block px-3 py-2 rounded {% if active == 'bans' %}bg-gray-800{% else %}hover:bg-gray-800{% endif %}">🚫 Bans</a>
      </nav>
      <div class="p-3 border-t border-gray-800 text-xs space-y-1">
        <a href="/" class="block hover:underline">← Back to site</a>
        <a href="/admin/" class="block hover:underline">Django admin</a>
        <a href="/logout/" class="block hover:underline text-red-400">Logout</a>
      </div>
    </aside>
    <main class="flex-1 p-6">
      <div class="md:hidden mb-4 flex gap-2 text-sm overflow-x-auto">
        <a href="{% url 'dash_index' %}" class="px-3 py-1 bg-white rounded border whitespace-nowrap">Dashboard</a>
        <a href="{% url 'dash_users' %}" class="px-3 py-1 bg-white rounded border whitespace-nowrap">Users</a>
        <a href="{% url 'dash_listings' %}" class="px-3 py-1 bg-white rounded border whitespace-nowrap">Listings</a>
        <a href="{% url 'dash_messages' %}" class="px-3 py-1 bg-white rounded border whitespace-nowrap">Messages</a>
        <a href="{% url 'dash_bans' %}" class="px-3 py-1 bg-white rounded border whitespace-nowrap">Bans</a>
      </div>
      {% if messages %}{% for m in messages %}<div class="bg-green-100 text-green-800 px-4 py-2 rounded mb-4">{{ m }}</div>{% endfor %}{% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
