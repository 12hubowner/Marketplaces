{% extends "core/base.html" %}
{% block content %}
<form method="post" enctype="multipart/form-data" class="max-w-md mx-auto bg-white rounded-lg p-6 shadow-sm space-y-4">
  {% csrf_token %}
  <h1 class="text-2xl font-bold">Profile settings</h1>
  {{ form.as_p }}
  <button class="w-full btn-green rounded py-2 font-semibold">Save</button>
</form>
<style>input,textarea{width:100%;border:1px solid #ddd;border-radius:6px;padding:.6rem;margin-bottom:.5rem}</style>
{% endblock %}
